<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="description" content="LusyChat 角色 Tag GPT-5.6 Sol 150 条审核页" />
    <title>角色 Tag 审核 · Sol 150 条</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar__inner">
        <div>
          <p class="eyebrow">LUSYCHAT · AI 初筛</p>
          <h1>角色 Tag 审核</h1>
          <p class="subtitle">GPT-5.6 Sol 一次筛选 · 共 150 条 · 建议尚未写入角色</p>
        </div>
        <div class="summary" id="summary" aria-label="审核统计"></div>
      </div>
    </header>

    <main>
      <section class="notice">
        <strong>筛选说明</strong>
        <span>正式环境只读抽样：Public 145 个、Unlisted 5 个；每页 50 条，候选仅使用当前 116 个常规 Tag。</span>
      </section>

      <section class="toolbar" aria-label="筛选工具">
        <input id="search" type="search" placeholder="搜索角色或 Tag" aria-label="搜索角色或 Tag" autocomplete="off" />
        <select id="change-filter" aria-label="筛选建议类型">
          <option value="all">全部角色</option>
          <option value="changed">有调整建议</option>
          <option value="add">有新增建议</option>
          <option value="remove">有删除建议</option>
          <option value="none">无调整建议</option>
        </select>
        <span id="visible-count" class="visible-count" aria-live="polite"></span>
      </section>

      <section id="cards" class="cards" aria-label="角色审核列表"></section>
      <nav id="pagination" class="pagination" aria-label="角色分页"></nav>
      <div id="empty" class="empty" hidden>没有符合条件的角色</div>
    </main>

    <footer>GPT-5.6 Sol 一次筛选 · 新增略宽松、删除严格 · Xiaoya 保护 Tag 不删除 · <span id="generated-at"></span></footer>

    <script src="data.js?v=sol150"></script>
    <script src="app.js?v=sol150"></script>
  </body>
</html>
