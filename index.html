<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="description" content="LusyChat 角色 Tag 首批 AI 审核页" />
    <title>角色 Tag 审核 · 首批 50 条</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar__inner">
        <div>
          <p class="eyebrow">LUSYCHAT · AI 初筛</p>
          <h1>角色 Tag 审核</h1>
          <p class="subtitle">首批 50 条 · 只展示建议，不写入正式库</p>
        </div>
        <div class="summary" id="summary" aria-label="审核统计"></div>
      </div>
    </header>

    <main>
      <section class="notice">
        <strong>筛选说明</strong>
        <span>原 Tag 按正常逻辑只显示已启用项；新增候选额外包含暂未启用的「体型差」「禁忌关系」，命中时会单独标记。</span>
      </section>

      <section class="toolbar" aria-label="筛选工具">
        <input id="search" type="search" placeholder="搜索角色或 Tag" aria-label="搜索角色或 Tag" autocomplete="off" />
        <select id="change-filter" aria-label="筛选建议类型">
          <option value="all">全部角色</option>
          <option value="changed">有调整建议</option>
          <option value="add">有新增建议</option>
          <option value="remove">有删除建议</option>
          <option value="none">无调整建议</option>
        </select>
        <span id="visible-count" class="visible-count" aria-live="polite"></span>
      </section>

      <section id="cards" class="cards" aria-label="角色审核列表"></section>
      <div id="empty" class="empty" hidden>没有符合条件的角色</div>
    </main>

    <footer>AI 一次筛选 · 原角色信息使用繁体多语言内容 · <span id="generated-at"></span></footer>

    <script src="data.js"></script>
    <script src="app.js"></script>
  </body>
</html>
